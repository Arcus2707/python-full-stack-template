[build-system]
requires = ["setuptools>=84.0.0", "setuptools-scm>=10.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
description = "Python full-stack application template backend."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["fastapi", "celery", "sqlalchemy", "template"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.52",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "celery[redis]>=5.6.3",
    "aiocache[redis]>=0.12.3",
    "redis>=5.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pyjwt>=2.10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "coverage[toml]>=7.15.4",
    "httpx>=0.28",
    "asgi-lifespan>=2.1",
    "aiosqlite>=0.20",
    "paracelsus>=0.8",
    "types-redis>=4.6",
]

[project.urls]
Homepage = "https://github.com/your-org/python-full-stack-template"
Repository = "https://github.com/your-org/python-full-stack-template"
Documentation = "https://github.com/your-org/python-full-stack-template/tree/main/docs"

[project.scripts]
app = "src.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["py.typed"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.0"

# --- Ruff -------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "ASYNC",
    "SIM", # flake8-simplify
    "RUF",
]
ignore = ["S101"] # allow asserts

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"alembic/**/*.py" = ["E501", "F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
docstring-code-format = true

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["celery.*", "aiocache.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery's task decorator is untyped; allow it within the worker module.
module = ["src.worker"]
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

# --- coverage ---------------------------------------------------------------
[tool.coverage.run]
branch = true
parallel = true
concurrency = ["multiprocessing", "thread"]
source = ["src"]
omit = ["src/main.py", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.paths]
source = ["src", "*/site-packages/src"]
