# Base Docker Compose stack: web, worker, beat, postgres and redis.
name: app

services:
  web:
    image: app:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/app
      APP_REDIS_URL: redis://redis:6379/0
      APP_CELERY_BROKER_URL: redis://redis:6379/1
      APP_CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: app:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["celery", "-A", "src.worker", "worker", "--loglevel=info"]
    env_file:
      - ../.env
    environment:
      APP_CELERY_BROKER_URL: redis://redis:6379/1
      APP_CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy

  beat:
    image: app:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["celery", "-A", "src.worker", "beat", "--loglevel=info"]
    env_file:
      - ../.env
    environment:
      APP_CELERY_BROKER_URL: redis://redis:6379/1
      APP_CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
