[loggers]
keys=root,uvicorn.access,sqlalchemy.engine

[handlers]
keys=console

[formatters]
keys=default

[logger_root]
level=INFO
handlers=console

[logger_uvicorn.access]
level=INFO
handlers=console
qualname=uvicorn.access
propagate=0

[logger_sqlalchemy.engine]
level=WARNING
handlers=console
qualname=sqlalchemy.engine
propagate=0

[handler_console]
class=StreamHandler
level=NOTSET
formatter=default
args=(sys.stdout,)

[formatter_default]
format=%(asctime)s | %(levelname)-8s | %(name)s | %(message)s
datefmt=%Y-%m-%dT%H:%M:%S
